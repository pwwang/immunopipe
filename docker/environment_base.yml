channels:
  - pwwang  # r-ggradar, r-seuratwrappers
  - conda-forge
  - bioconda
  - nodefaults
  - pytorch  # for ClusTCR
dependencies:
  - nodejs=22  # pipen-report
  - python=3.12
  - curl  # force using conda-forge version
  - pip
  - procps-ng
  - fontconfig
  - graphviz  # pipen-diagram
  - git  # for copier, used by pipen-report
  - jq  # Needed by bioconda::bioconductor-genomeinfodbdata post-link
  - uv
  - libiconv # fix git: error while loading shared libraries: libiconv.so.2
  - time  # for pipen-runinfo
  - wget
  - gcc_linux-64
  - r-base=4.5
  - pwwang::bioconductor-data-packages
  - pwwang::bioconductor-glmgampoi
  - bioconductor-destiny  # ModuleScoreCalculator (diffusion map)
  - bioconda::bioconductor-deseq2
  - bioconda::bioconductor-edger
  - bioconda::bioconductor-slingshot
  - pwwang::r-hdf5r  # Read_10x_h5() by Seurat
  - r-laplacesdemon  # TESSA
  - r-logger
  - r-presto  # MarkersFinder
  - r-hash  # CDR3AAPhyschem
  - r-glmnet  # CDR3AAPhyschem
  # - r-matrixstats=1.1.0  # useNames = NA  deprecated
  - r-matrixstats  # useNames = NA  deprecated
  - r-broom.mixed  # CDR3AAPhyschem
  - r-seuratwrappers
  # needed by r-biopipen.utils
  - r-bracer
  - r-doubletfinder >=2.0.6
  - r-testthat
  - r-tidyseurat
  - bioconda::bioconductor-biocparallel
  - bioconda::bioconductor-celda
  - bioconda::bioconductor-mygene
  - bioconda::bioconductor-scdblfinder
  - bioconda::bioconductor-ucell
  - bioconda::bioconductor-aucell
  - bioconda::bioconductor-gseabase
  - bioconda::bioconductor-singscore
  - bioconda::bioconductor-scmap
  - bioconda::bioconductor-chetah
  - bioconda::bioconductor-scclassify
  - bioconda::bioconductor-gsva
  - pwwang::r-seuratdisk
  - r-qs2
  # Needed by r-scplotter
  - pwwang::bioconductor-screpertoire=2.9
  - pwwang::r-metap
  - pwwang::r-tidyprompt
  # - r-ggplot2 > 4  # required by biopipen.utils.R
  # Suggests
  - pwwang::r-sccatch
  - pwwang::r-sccdc
  - pwwang::r-scsorter
  - pwwang::r-scina
  - pwwang::r-cellid
  - pwwang::r-lict
  - pwwang::r-mllmcelltype
  - pwwang::r-scinfer
  - pwwang::r-llmcelltype
  # singleR
  - conda-forge::r-snow
  - conda-forge::r-futile.logger
  - bioconda::bioconductor-singler
  - bioconda::bioconductor-complexheatmap
  - r-ggpubr >1.0.0  # https://github.com/kassambara/ggpubr/issues/751
  - pwwang::bioconductor-ggmanh
  # - faiss-cpu  # =1.13  # supports numpy v2, required by clustcr
  - clustcr=2026  # adopted to work with numpy v2
  - mscorefonts  # additional fonts for plots
  # - r-hitype  # sctype will also be supported
  # unable to load shared object: stringfish.so for the one from r channel
  # - pwwang::r-stringfish
  - r-scplotter
  - r-plotthis
  - r-enrichit
  - r-gglogger
  - r-hitype
  - r-biopipen.utils
  - r-scpred
